version: 1

guardrails:
  - type: LimitInputLength
    config:
      max_chars: 500
      max_tokens: 100

  - type: DetectPII
    config:
      types: [email, phone, ssn]

  - type: DetectPromptInjection
    config:
      sensitivity: medium

  - type: LimitOutputLength
    config:
      min_chars: 20
      min_words: 5

  - type: RedactSecrets
    config:
      patterns:
        - openai_api_key
        - github_token
        - aws_access_key

  - type: DetectHallucination
    config:
      check_uncertainty: true
      check_placeholders: true
