name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # Publish only for a real release, or a manual re-run pinned to a v* tag.
    # This stops workflow_dispatch from publishing off an arbitrary branch.
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v'))

    # Trusted Publishing (OIDC): no long-lived PyPI token. The id-token
    # permission lets PyPI verify this workflow via the `pypi` environment.
    environment:
      name: pypi
      url: https://pypi.org/p/pydantic-ai-guardrails
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build package
        run: |
          pip install build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
