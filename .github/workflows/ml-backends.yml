name: ML backends

# Real Presidio / Detoxify / transformers smoke tests. Heavy (torch, models),
# so they run weekly and on demand rather than on every push.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backends
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,pii-detection,toxicity-detection,prompt-injection]"
          python -m spacy download en_core_web_lg

      - name: Run backend smoke tests
        run: pytest -v tests/test_backends_real.py -W ignore::FutureWarning
