name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Codecov OIDC upload
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,evals,json-schema,yaml,tokens,telemetry]"
          pip list

      - name: Verify installation
        run: |
          python -c "import pydantic_ai_guardrails; print(f'Version: {pydantic_ai_guardrails.__version__}')"

      - name: Run linting
        run: ruff check src tests examples

      - name: Run type checking
        run: mypy src

      - name: Run tests
        # Coverage floor lives in pyproject.toml ([tool.coverage.report] fail_under).
        run: pytest -v --cov=src --cov-report=xml --cov-report=term-missing --tb=short

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          # Tokenless upload via GitHub OIDC once the repo is active on codecov.io.
          # The coverage gate is pytest's fail_under, so reporting stays non-blocking.
          use_oidc: true
          fail_ci_if_error: false
